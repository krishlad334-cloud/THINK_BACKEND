<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OverThink — Consultant &amp; Admin Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="container navbar-inner">
        <a href="./index.html" class="brand">
          <span class="brand-mark">OT</span>
          <span>OverThink Workspace</span>
        </a>
        <div class="nav-actions">
          <span id="adminUserBadge" class="status-pill hidden"></span>
          <button id="adminLogoutBtn" type="button" class="btn btn-secondary btn-sm hidden">Sign Out</button>
          <a href="./index.html" class="btn btn-secondary btn-sm">Back to Site</a>
        </div>
      </div>
    </header>

    <main class="container" style="padding-top: 32px; padding-bottom: 48px;">
      <!-- Protected Login View -->
      <section id="adminLoginSection" class="card" style="max-width: 480px; margin: 24px auto;">
        <h1 class="card-title" style="font-size: 1.5rem; margin-bottom: 6px;">Consultant / Admin Sign In</h1>
        <p class="card-subtitle">
          Log in with a <strong>consultant</strong> or <strong>admin</strong> account to review submitted thoughts and post solutions.
        </p>

        <div id="adminLoginAlert" class="alert" role="status"></div>

        <form id="adminLoginForm">
          <div class="field">
            <label for="adminEmail">Email Address</label>
            <input id="adminEmail" type="email" placeholder="consultant@overthink.app" required />
          </div>
          <div class="field">
            <label for="adminPassword">Password</label>
            <input id="adminPassword" type="password" placeholder="Enter password" required />
          </div>
          <button id="adminLoginBtn" type="submit" class="btn btn-primary" style="width: 100%;">
            Sign In to Workspace
          </button>
        </form>
      </section>

      <!-- Workspace Dashboard -->
      <section id="adminDashboardSection" class="hidden">
        <div class="card" style="margin-bottom: 24px;">
          <div class="card-header">
            <div>
              <h1 class="card-title" style="font-size: 1.45rem;">Submitted Thoughts Queue</h1>
              <p class="muted">Filter pending thoughts, update workflow status, and deliver solutions.</p>
            </div>
            <button id="refreshQueueBtn" type="button" class="btn btn-secondary btn-sm">Refresh</button>
          </div>

          <div class="form-grid" style="grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));">
            <div class="field" style="margin-bottom: 0;">
              <label for="filterStatus">Status</label>
              <select id="filterStatus">
                <option value="">All Statuses</option>
                <option value="pending" selected>Pending</option>
                <option value="accepted">Accepted</option>
                <option value="in_progress">In Progress</option>
                <option value="answered">Answered</option>
                <option value="resolved">Resolved</option>
                <option value="closed">Closed</option>
              </select>
            </div>
            <div class="field" style="margin-bottom: 0;">
              <label for="filterCategory">Category</label>
              <select id="filterCategory">
                <option value="">All Categories</option>
                <option value="business">Business</option>
                <option value="career">Career</option>
                <option value="personal">Personal</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="field" style="margin-bottom: 0;">
              <label for="filterSearch">Search</label>
              <input id="filterSearch" type="text" placeholder="Search keyword, name, email..." />
            </div>
          </div>
        </div>

        <div id="dashboardAlert" class="alert" role="status"></div>
        <div id="thoughtsQueue" class="stack"></div>

        <div class="inline-row" style="justify-content: space-between; margin-top: 20px;">
          <button id="prevPageBtn" type="button" class="btn btn-secondary btn-sm">Previous</button>
          <span id="paginationInfo" class="muted">Page 1 of 1</span>
          <button id="nextPageBtn" type="button" class="btn btn-secondary btn-sm">Next</button>
        </div>
      </section>
    </main>

    <script src="./js/api.js"></script>
    <script src="./js/admin.js"></script>
  </body>
</html>
